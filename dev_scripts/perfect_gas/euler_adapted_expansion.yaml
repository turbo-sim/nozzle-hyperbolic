boundary_conditions: 
  p_stagnation: 5e5
  T_stagnation: 500
  # p_out: 2.8e5
  p_out: 3.5e5

  # p_out: 0.53538e5

# Numerical settings
numerical_settings:
# Define the grid
  Nx: 300 # Number of cells
  x1: 0.00  # Left boundary
  x2: 1  # Right boundary
  t1: 0.00  # Initial time
  t2: 10  # Final time
  CFL: 0.5 # Maximum allowed local Courant number

nozzle_geometry:
# Define nozzle area
  r0: 3
  rt: 0.5


