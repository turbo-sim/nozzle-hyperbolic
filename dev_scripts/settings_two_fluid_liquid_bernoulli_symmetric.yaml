# ─────────────────────────────────────────────────────────────────────────────
# LIQUID-DOMINANT low-speed validation: two-fluid solver vs analytic Bernoulli.
#
# Goal
# ----
# Validate the two-fluid Städtke FVS solver in the LOW-SPEED LIQUID (flashing-inlet)
# regime by collapsing it to the single-phase incompressible limit and comparing to
# the ANALYTIC Bernoulli profile:
#     u_l(x) = u_in·A_in/A(x)   (mass),   p(x) = p0 − ½ρ_l u_l²   (Bernoulli).
# The ghost-limit solution must reproduce this to O(Ma²).
#
#   liquid = water  (DOMINANT, alpha_l ≈ 1 − 1e-4, subcooled)   — FluidBicubic table
#   gas    = Air    (GHOST,    alpha_g ≈ 1e-4)                  — PERFECT GAS (analytic)
#
# Why a perfect-gas ghost: it is analytic and UNBOUNDED — no EOS table to
# extrapolate off of → the startup overshoot / dt-collapse failure mode is
# structurally impossible.  At alpha_g ≈ 1e-4 the ghost EOS is thermodynamically
# irrelevant to the water answer, so its accuracy does not matter — only robustness.
# (No saturation props → only usable with mass_transfer=False, which is this case.)
#
# ►►► DRIVER KNOB (not in this YAML): SRC_SCALE = 1.0 REQUIRED (2026-07-14).
#     Eigen-proven: with SRC=0 the ghost h_g is violently unstable (65 modes,
#     +4.2e5/s at the inlet cell — massless ghost energy undamped, and the
#     stagnation BC maps h_g noise into ~0.2 bar/kJ/kg of inlet-p noise via the
#     gas isentrope).  With SRC=1.0 drag+heat slave the ghost: 0 unstable modes.
#     SRC=1.0 does NOT contaminate the Bernoulli comparison: at the no-slip,
#     equal-T steady state, drag (∝du=0) and heat (∝ΔT=0) vanish identically —
#     sources act only on the transient.  AREA_SRC stays True (term under test).
# ─────────────────────────────────────────────────────────────────────────────

fluid:
  name: water        # global default; each eos section overrides per phase

eos:
  # ── GHOST gas: analytic perfect gas (no table, no bounds, explosion-proof) ──
  gas:
    fluid_name: Air
    backend: perfect_gas        # → jxp.FluidPerfectGas (config_loader dispatches)
    T_ref: 300.0                # constants fit at this reference state …
    p_ref: 2000000.0            # … near the operating point (2 MPa, 300 K)
  # ── DOMINANT liquid: real subcooled water table ──
  liquid:
    fluid_name: water
    backend: HEOS
    h_min: 1000.0     # J/kg   (water at ~2 MPa, 295 K subcooled → h ≈ 90 kJ/kg)
    h_max: 140000.0   # J/kg
    p_min: 10000.0    # Pa
    p_max: 6000000.0  # Pa  (60 bar — well above the tiny Bernoulli dip)
    N_h: 145
    N_p: 200
    table_dir: fluid_tables
    gradient_method: forward
    # metastable_phase omitted ⇒ ordinary subcooled-liquid table, no sat props.

# ── Grid ─────────────────────────────────────────────────────────────────────
grid:
  Nx: 1000
  x1: 0.0
  x2: 0.2                       # = L of the symmetric parabolic nozzle
  radius: 0.01

# ── Geometry (same symmetric Elliot nozzle) ──────────────────────────────────
geometry:
  function: get_symmetric_nozzle
  roughness: 0.0

# ── Interphase closure ────────────────────────────────────────────────────────
sources:
  bubble_number:  1.0e13
  droplet_number: 1.0e11
  mass_transfer: false          # two-component, NO phase change (perfect-gas ghost)

# ── Numerics ──────────────────────────────────────────────────────────────────
numerics:
  # Acoustically stiff ghost limit: a_mix≈1400 m/s vs u≈3 m/s.  The operator is
  # eigen-certified stable (SRC=1), so implicit Euler can take large acoustic
  # CFL; material CFL stays <1 (u·dt/dx ≈ 0.9 at CFL 20).
  # CFL 5 CERTIFIED under eos_rows (2026-07-15: 1500-step ghost march, SSR
  # MONOTONE 9.5e-5→6.9e-5 — the old CFL≥2 instability was the min-norm null
  # space, removed by the E3 rows).  If halvings/NaN appear, fall back 5→2→1.
  CFL: 10.0
  newton_iter: 7
  delta_factor: 1e-6
  # muscl_van_albada (NEW 2026-07-14 eve): SMOOTH C¹ limiter.  van Leer SWITCHES
  # slopes on the residual ghost-scale 2Δx noise (slope flicker = slow pump →
  # grew at CFL 1, exploded at CFL 5); the ε²-regularized van Albada responds as
  # O(noise³/ε²) to sub-ε noise → no flicker, still 2nd order on smooth
  # gradients.  Switch recon to it if the van Leer test fails:
  # recon: muscl_van_albada
  recon: muscl_van_albada
  k_vm: 0.5
  jacobian: colored
  jacobian_validate: false
  profile: false
  # LIQUID-DOMINANT ⇒ nearly incompressible ⇒ ρa² ~ 2e9 (vs gas ~3e6).  The old
  # overflow concern is OBSOLETE: row equilibration (in the Newton body) dropped
  # κ(J) from ~1e13 (pure unit scaling) to ~74, so the normal equations are safe.
  # normal_eq_banded = same numbers in O(N), certified by debug_banded_solve.py.
  linear_solve: normal_eq_banded
  # CONVICTED + FIXED (debug_throat_texture.py, 2026-07-16): the 1.0 floor
  # (full acoustic dissipation, a≈1400 m/s jump scaling at Ma~0.03) WAS the
  # throat p-texture — its steady footprint at the max-dA/dx cells failed
  # check_bernoulli 3/7a (c3 9.8e-2, 7a 6.7e-2).  With 0.0 (Ma-scaled Rieper
  # dissipation) the texture drops ×35 at the dA-max cell; 5000-step march:
  # c3 → 5.1e-3, 7a 7.2e-3, no checkerboard at CFL 5 (the old checkerboard's
  # real causes — area imbalance + EOS null space — are fixed by wb-area/E3).
  # eps_void stays ON: probe config D (both off) degraded u_l/mass-flux noise.
  lowmach_diss: 1.0
  # Boundary-face exemption (2026-07-17): full upwind dissipation on the first
  # and last face ONLY, so the stagnation/back-pressure BCs are enforced
  # stiffly even at Ma~0.007 (interior keeps the Ma-scaled low-dissipation
  # scheme).  Without it p_out parks as a standing jump at the outlet face and
  # the mass flow creeps (grid-dependent settled u_in, slow outlet tail).
  lowmach_diss_bc: 1.0
  nc_scale: 1.0
  # 4th-order JST void filter (velocity-gated).  Everything here is low-velocity
  # (u ~ 1–few m/s) so the gate is effectively fully ON — fine for a first run.
  eps_void: 0.5
  eps_void_ucut:   null
  eps_void_uwidth: 12.0
  eps_void_scale:  frozen
  eps_ghost: 0.5
  # eps_ghost: 0.0
  # ZERO-SLIP flux everywhere (2026-07-14): drag pins du≈0, so the default blend
  # window [0.01,0.1] m/s sits exactly in the du range this case sweeps through
  # during transients → branch alternation noise.  1e9 = P12 formulation always.
  du_blend_lo: 1.0e9
  du_blend_hi: 2.0e9
  # ── GENERAL w_ref (2026-07-17, replaces the hand-tuned ghost floors) ────────
  # 'auto' = per-variable floors 0.05·max|W| recomputed from the current Newton
  # iterate.  Certified by debug_wref_sensitivity.py: BIT-IDENTICAL to the old
  # hand list [1e5,1e-5,1e-4,0.5,10,0.5,1e1,1e6] on the ghost state AND to the
  # solver defaults on the two-component state (a floor only acts where it
  # exceeds the local |W| — any floor at/below the field scale leaves
  # w_ref=|W|).  Mis-scaled floors no longer explode under E3, they only
  # inflate the SSR floor (defaults-on-ghost ×180, all-ones ×3e4) — 'auto'
  # makes that impossible and adapts through flashing (α 1e-4 → 0.9).
  w_char: auto
  # ── E3-AUGMENTED SYSTEM (2026-07-15, certified ×3: ghost CFL1, ghost CFL5,
  # two-comp anchor).  The 2 EOS closures are RESIDUAL ROWS (8×8 least squares):
  # no per-cell null space → the secular m_l drift that killed the 2026-07-15
  # morning run (e_l → 0.5 by step ~3500 → checkerboard → death @4700) is
  # structurally gone (e_l ~1e-16 over 1500-step marches).  Projection is
  # OBSOLETE under eos_rows → eos_project: false.  NOTE: dense solve path until
  # the banded adaptation lands (~1.5-2 s/step at N300; SSR can actually reach
  # ssr_tol now — the two-comp march hit 3e-7 in 400 steps).
  eos_rows: true
  # E3-BANDED twin (new option 2026-07-16): O(N) block-banded solve, same
  # numbers as the dense path.  CERTIFIED by debug_banded_e3.py on the
  # converged 2026-07-16 N300 run: J blocks exact 0, dW 3.9e-10 rel, full-step
  # W ~1e-14 / ssr 6e-11 rel, ×3.9 speed (2033→520 ms/step).  Set false to
  # fall back to the certified dense path.
  eos_rows_banded: true
  # JACOBIAN LAGGING with RESIDUAL-GROWTH GUARD (2026-07-16 evening): J is
  # recomputed every jac_lag-th Newton iteration AND whenever ‖R‖ failed to
  # decrease since the previous iteration.  The guard fixes the transient
  # divergence that killed the 17:0x runs (pure scheduled lag exploded from
  # the restart pickle); certified BOTH ways: from the pickle lag10 now
  # tracks lag1 (SSR 1.184e-4 both, guard auto-reverts to per-iteration J,
  # no speedup there), near steady the guard is silent and the full speedup
  # returns (×1.5, SSR dev 8e-11).  jac_lag: 1 = certified per-iteration
  # Newton (the guard-free body).
  jac_lag: 1
  eos_project: false
  # Well-balanced NC form (2026-07-15): face-area-weighted one-sided flux
  # differences — fixes the α-front-on-taper imbalance, identical to 'cell'
  # elsewhere (recert march matched certified numbers digit-for-digit).
  nc_form: wb
  pin_ghost_momentum: false

# ── Initial / inlet condition ─────────────────────────────────────────────────
ic:
  # RESTART from the smoothed 2026-07-14 16:39 run state (water already ~on the
  # Bernoulli profile; restart drains the trapped startup acoustics instead of
  # re-launching them).  For a cold start switch back to type: bernoulli.
  
  # type: nozzlex # nozzlex stagnation
  # pickle: results/smoothed_restart_bernoulli.pkl
  # type: stagnation
  type: restart
  # run: results_single_phase_validation/bernoulli_N250_muscl_van_albada_20260725_155111 # results/nozzle_valid_liquiddom_N300_muscl_van_albada_20260718_164645     # or a solution.csv path
  run: results_single_phase_validation\bernoulli_N500_muscl_van_albada_20260728_154326 #  bernoulli_N100_muscl_van_albada_20260728_100813
# u_in raised 1→3 m/s (2026-07-14): dynamic head ×9 (THROAT dip ~10 bar — u
  # peaks at 45.6 m/s; exit dip vs p0 only ~4.5 kPa since A_out=A_in) and
  # material transit time ÷3.  Ma_l ~ 3e-2 → O(Ma²) ~ 1e-3 still fine.
  u_in: 3.0                     # m/s — dominant (liquid) inlet velocity

# ── Boundary conditions ───────────────────────────────────────────────────────
# Reservoir inlet + back-pressure outlet.  For the symmetric Elliot nozzle the
# exit area ≈ inlet area ⇒ u_exit ≈ u_in, so the consistent back-pressure is
# p_out = p0 − ½ρ_l u_in²  (≈ 2 MPa − 500 Pa).  The IC and BCs then agree and the
# transient should merely relax onto the analytic Bernoulli profile.
bc:
  inlet: stagnation
  outlet: characteristic

  p0:            2000000.0      # Pa — reservoir (stagnation) pressure
  T_g0:          300.0          # K  — gas    stagnation temperature
  T_l0:          300.0          # K  — liquid stagnation temperature
  void_fraction: 1.0e-5         # alpha_g ≈ 1e-4 ⇒ LIQUID dominant (dom='liquid')
  slip:          1.0            # S = u_g/u_l = 1 (no slip)

  p_out:         1.98e6 # 1995500.0  # 19.47e5 1980000.0   # Pa ≈ p0 − ½ρ_l u_in² (ρ_l≈998, u_in=3 → ~4.5 kPa dip)
  p_out_relax:   1.0

# ── Time-step control ─────────────────────────────────────────────────────────
time_control:
  # RE-ENABLED (2026-07-14 evening): with adaptive OFF a single Newton overshoot
  # NaN'd the run (perfect-gas p<0 → rho<0 → sqrt NaN; clips now guard this in
  # matrices/sources, but keep the gate as the safety net).  With the SLAVED-
  # ghost restart IC the per-step changes are small → the gate should rarely
  # fire and dt grows to the full CFL-20 value instead of being pinned.
  adaptive_dt:  true
  max_halvings: 8
  dp_max:       0.50
  dh_max:       0.05
  du_max:       0.20
  da_max:       0.10
  dt_grow:      1.20

# ── Run control ───────────────────────────────────────────────────────────────
run:
  n_steps: 500000
  print_every: 100
  ssr_tol: 1e-9
  t_end: null
  plateau_window: 4000
  plateau_ratio: 1.01
  visualize_ic: true           # set true to eyeball the Bernoulli IC before solving
  debug_newton: false

save_options:
  repo_main: results_single_phase_validation
  repo_run: bernoulli
