boundary_conditions:
  p_stagnation: 2.0e5    # Pa  — 2 bar, well into ideal-gas regime for Air
  T_stagnation: 300.0    # K
  p_out:        1.3e5   # Pa  — supersonic design condition (A/A*=2, γ=1.4, M≈2.2)
  # p_out:        18450.0  # Pa  — supersonic design condition (A/A*=2, γ=1.4, M≈2.2)
  # p_out: 6000

numerical_settings:
  Nx: 240
  x1: 0.0
  x2: 0.2           # matches geometry L=0.2
  t1: 0.00
  t2: 100.0          # large — residual criterion will stop iteration first
  CFL: 0.5         # keep small for shock capture; supersonic cases can use larger
  max_iterations: 10000
  residuals: 1.0e-6

  flux_method: hllc  # ignored by fvs_newton, kept for completeness

  time_discretization: fvs_newton
  initialization: shocked   # 'shocked' | 'subsonic' | 'isentropic' | 'simple'
  x_shock_fraction: 0.88   # 88% of nozzle length ≈ analytical shock position for p_out=58450 Pa

  reconstruction: muscl_van_leer # muscl_van_leer | constant
  delta_factor: 1e-6    # global floor on eigenvalue smoothing; 1e-12 makes Jacobian blind at shock → dt collapse
  newton_iter:  10    # Newton iterations per step (default 20; more = more accurate but slower compile)

  wall_friction: false  # frictionless — exact solution assumes inviscid

geometry:
  function: get_symmetric_nozzle
  roughness: 0.0
  L:        0.2     # nozzle length [m]
  A_inlet:  0.30    # inlet/outlet area [m²]   → area ratio A_inlet/A_throat = 2
  A_throat: 0.15    # throat area [m²]

fluid:
  perfect_gas: false   # fvs_newton requires real-gas EOS
  fluid_name: Air
  use_lookup_table: true
  lut:
    backend:   HEOS
    h_min:     150000.0   # J/kg  →  covers exit at M≈2.2, T≈152 K
    h_max:     500000.0   # J/kg  →  well above stagnation h≈400 kJ/kg at T0=300 K
    p_min:     5000.0     # Pa    (below p_out)
    p_max:     500000.0   # Pa    (above p0)
    N_h:       100
    N_p:       80
    table_dir: fluid_tables
