boundary_conditions:
  p_stagnation:  5e5
  T_stagnation: 348
  p_out: 4e5
 
# Numerical settings
numerical_settings:
  Nx: 200 # Number of cells
  x1: -0.03201  # Left boundary
  x2: 0.06636   # Right boundary
  t1: 0.00  # Initial time
  t2: 120  # Final time
  CFL: 10 # Maximum allowed local Courant number
  max_iterations: 1000000
  residuals: 0.0001
  # ── Flux method ────────────────────────────────────────────────────────
  # rusanov | hll | hllc | lf    (JAX, real gas)
  # roe                           (NumPy, real gas)
  # NOTE: ignored when time_discretization is fvs_newton
  flux_method: hllc

  # ── Time discretization ─────────────────────────────────────────────────
  # euler           — explicit forward Euler            (JAX/NumPy)
  # RK3             — SSP Runge-Kutta 3rd order         (JAX/NumPy)
  # RK4             — classic 4th-order Runge-Kutta     (JAX/NumPy)
  # implicit        — diagonal implicit (pseudo-time)   (JAX/NumPy)
  # fvs_newton  — Städtke FVS + full Newton-Raphson (JAX, real gas only)
  #                   Works in (p,u,h) primitives; flux_method is ignored.
  #                   Jacobian via jax.jacobian; 3 Newton iters/step.
  #                   Keep Nx <= 500 (dense Jacobian). CFL can be raised to 5-10.
  # time_discretization: implicit
  time_discretization: fvs_newton

  # ── Wall friction ────────────────────────────────────────────────────────
  # true  = Haaland pipe friction on momentum (default)
  # false = frictionless duct (shock tube validation)
  wall_friction: true

  # ── Reconstruction ──────────────────────────────────────────────────────
  # constant | muscl_minmod | muscl_van_leer | muscl_superbee
  # NOTE: ignored for fvs_newton (always uses Van Leer in (p,u,h))
  # NOTE: MUSCL + euler requires CFL <= 0.5
  reconstruction: MUSCL

  # ── Warmup (JAX path only, not fvs_newton) ──────────────────────────
  # Omit this block to skip warmup entirely.
  warmup:
    n_iterations: 100
    flux_method: rusanov
    reconstruction: constant
    CFL: 20
 
geometry:
  function: get_pipe
  roughness: 0.0
  # area: 1.0 
 
