boundary_conditions:
  p_stagnation: 2.0e5    # Pa
  T_stagnation: 300.0    # K
  p_out:        1.9e5    # Pa — ~5 % drop, M_exit ≈ 0.26 (ideal gas)

numerical_settings:
  Nx: 150
  x1: 0.0
  x2: 0.5
  t1: 0.00
  t2: 1000.0
  CFL: 20
  max_iterations: 200000
  residuals: 1.0e-6

  flux_method: hllc        # ignored by fvs_newton
  time_discretization: fvs_newton
  initialization: simple       # 'simple' (robust, subsonic start) | 'isentropic' (branch-selected, best for nozzles)
  reconstruction: muscl_van_leer # start 1st-order; switch to muscl_van_leer to compare
  wall_friction: true

geometry:
  function: get_pipe
  roughness: 0.0
  radius: 0.05            # constant area = π r² ≈ 7.85e-3 m²

fluid:
  perfect_gas: false
  fluid_name: Air
  use_lookup_table: true
  lut:
    backend:   HEOS
    h_min:     200000.0   # J/kg — subsonic Air at 300 K → h ≈ 301 kJ/kg, well inside
    h_max:     500000.0   # J/kg
    p_min:     1.0e5      # Pa   — below p_out
    p_max:     4.0e5      # Pa   — above p_stagnation
    N_h:       60
    N_p:       40
    table_dir: fluid_tables
