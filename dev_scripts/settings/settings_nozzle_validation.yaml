boundary_conditions:
  p_stagnation: 2e5    # Pa  — 2 bar, well into ideal-gas regime for Air
  T_stagnation: 295.15    # K
  # p_out:        9.8e4   # Pa  — supersonic design condition (A/A*=2, γ=1.4, M≈2.2)
  p_out:        18450.0  # Pa  — supersonic design condition (A/A*=2, γ=1.4, M≈2.2)
  # p_out: 6000

numerical_settings:
  Nx: 100
  x1: 0.0
  x2: 0.31           # matches geometry L=0.2
  t1: 0.00
  t2: 100.0          # large — residual criterion will stop iteration first
  CFL: 0.5         # keep small for shock capture; supersonic cases can use larger
  max_iterations: 10000
  residuals: 1.0e-6
 
  flux_method: hllc  # ignored by fvs_newton, kept for completeness

  time_discretization: fvs_newton
  initialization: isentropic   # 'shocked' | 'subsonic' | 'isentropic' | 'simple'
  x_shock_fraction: 0.88   # 88% of nozzle length ≈ analytical shock position for p_out=58450 Pa

  reconstruction: muscl_van_leer # muscl_van_leer | constant
  delta_factor: 1e-6    # global floor on eigenvalue smoothing; 1e-12 makes Jacobian blind at shock → dt collapse
  newton_iter:  5    # Newton iterations per step (default 20; more = more accurate but slower compile)

  jacobian: colored          # dense (exact AD, O(N²)) | colored (banded, O(N), same matrix)
  jacobian_validate: false   # one-shot startup check: max|J_colored - J_dense| must be ~0

  adaptive_dt: false            # true = halve dt on large Δp/Δh/Δu (safe); false = full CFL dt, accept always (faster, no safety net)

  wall_friction: false  # frictionless — exact solution assumes inviscid

  # 4th-order JST filter for the low-Mach PRESSURE checkerboard (port of the
  # two-fluid eps_void filter).  0.0 = OFF (identical to previous behaviour).
  # Conservative flux, O(eps·Δx³) on smooth flow — sweep 0.02→0.1 and confirm
  # the profile is ε-independent.  ucut/uwidth [m/s] = optional velocity gate
  # (null → uniform; leave ungated here — the p-mode sits at the THROAT).
  eps_filter: 0.05
  eps_filter_ucut: null
  eps_filter_uwidth: null

  profile: false         # JAX device trace → <out_dir>/jax_trace; view at ui.perfetto.dev or tensorboard

  # -- Speed-up switches (SPEEDUP_REPORT_FVS_SINGLE_PHASE.md) ---------------
  # Key absent = original code path.  The values below change the result only
  # at round-off (<= 1e-10); ser_beta > 0 changes the path to the steady state
  # (steady cases only, never for transients).
  linear_solver: banded     # dense | banded (O(N) block-tridiagonal LU)
  newton_tol: 1.0e-8        # 0 = always newton_iter Newton iterations
  flux_local_jac: true      # per-face local Jacobian (custom JVP)
  cell_local_jac: true      # per-cell EOS local Jacobian (custom JVP)
  fast_increments: true     # jitted dp/dh/du step check in the driver
  ser_beta: 0.0             # 1.0 = SER CFL ramp CFL*(SSR_1/SSR)^beta
  ser_cfl_max: 50.0         # cap of the ramp (500 cycled on HEM N=500)
  cpu_affinity: "0-15"      # P-cores of this laptop; null = no pinning


geometry:
  function: get_symmetric_nozzle
  roughness: 0.0
  # L:        0.2     # nozzle length [m]
  # A_inlet:  0.30    # inlet/outlet area [m²]   → area ratio A_inlet/A_throat = 2
  # A_throat: 0.15    # throat area [m²]

fluid:
  perfect_gas: false   # fvs_newton requires real-gas EOS
  fluid_name: Air
  # fluid_name: water
  use_lookup_table: true
  lut:
    backend:   HEOS
    h_min:     150000.0   # J/kg  →  covers exit at M≈2.2, T≈152 K
    h_max:     500000.0   # J/kg  →  well above stagnation h≈400 kJ/kg at T0=300 K
    p_min:     5000.0     # Pa    (below p_out)
    p_max:     500000.0   # Pa    (above p0)
    N_h:       100
    N_p:       80
    table_dir: fluid_tables
    # backend: HEOS
    # h_min: 1000.0    # J/kg
    # h_max: 140000.0   # J/kg
    # p_min: 10000.0   # Pa
    # p_max: 6000000.0  # Pa  (60 bar, was 30)
    # N_h: 145
    # N_p: 200
    # table_dir: fluid_tables
    # gradient_method: forward
