# ─────────────────────────────────────────────────────────────────────────────
# FLASHING nozzle — SMD single-component water case (mirror of
# demo/smd_two_fluid_nozzlex_solution.py, case "a").
#
# Physics: HOT subcooled water (120 bar, 578.95 K ≈ 19 K below T_sat(120bar)=
# 597.8 K) accelerates through the SMD converging-diverging nozzle; as p drops
# the liquid becomes superheated (metastable) and FLASHES → vapor grows from a
# ghost.  Single component (water liquid ↔ water vapor), mass transfer ON.
#
#   liquid = water metastable LIQUID  (DOMINANT, α_l ≈ 1)   ← the flashing liquid
#   gas    = water metastable VAPOR   (GHOST at inlet, α_v small)  ← grows by flashing
#
# TARGET DRIVER: main_two_fluid_single_phase.py (stagnation reservoir inlet +
# characteristic outlet + the mass_transfer toggle it already carries).  Point
# its SETTINGS_YAML at this file.  This is the FIRST real-two-phase rung after
# the gas-dominant tier — both phases carry mass through the flashing front, so
# the ghost-limit pathology class (eps_ghost saga) is absent by construction.
#
# ►►► CAVEATS to watch on the first run (all flagged inline below):
#   1. Ghost vapor thickness: demo uses α_v,in = 1e-6, but α_v = 1e-5 FAILED in
#      the shock case (ghost-h instability) WITHOUT mass transfer.  Here mass
#      transfer FEEDS the vapor, which should stabilise it — but the pre-flashing
#      inlet region is still a passive ultra-thin ghost.  Started at 1e-4
#      (certified-safe thickness); thin toward 1e-6 once stable.
#   2. The nozzlex demo sets heat_transfer = 0.0 (NO interphase heat exchange);
#      our closure ALWAYS includes interphase HTC.  For matching the SMD data
#      this may need a closure knob (future work) — first just get it flashing.
#   3. Domain x2 = 0.6 m keeps the exit pressure inside the tables (A/A*≈3.4);
#      extending to ~0.9 m (r_outlet, A/A*≈13) would drop p below the 1-bar
#      table floor.  Refine Nx if the flashing front needs resolution.
# ─────────────────────────────────────────────────────────────────────────────

fluid:
  name: water

# ── EOS tables (from smd_two_fluid_nozzlex_solution.py, case "a") ─────────────
# Single-component water: BOTH phases are water, each with its own metastable
# extension + saturation properties (N_p_sat) that the mass-transfer source reads.
eos:
  gas:                              # water metastable VAPOR (the ghost that grows)
    fluid_name: water
    backend: HEOS
    h_min: 2200000.0    # J/kg
    h_max: 3400000.0    # J/kg
    p_min: 10000.0      # Pa  (0.1 bar)
    p_max: 13000000.0   # Pa  (130 bar)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: vapor         # extends into subcooled (metastable) vapor
    gradient_method: forward
  liquid:                           # water metastable LIQUID (the dominant flashing phase)
    fluid_name: water
    backend: HEOS
    h_min: 100000.0     # J/kg
    h_max: 1800000.0    # J/kg
    p_min: 10000.0     # Pa  (0.1 bar)
    p_max: 13000000.0   # Pa  (130 bar)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: liquid        # extends into superheated (metastable) liquid
    gradient_method: forward

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  Nx: 100
  x1: 0.0
  x2: 1.2        # m — see caveat 3 (keeps p_exit in-table; full nozzle ≈ 0.9 m)
  radius: 0.01   # legacy fallback (geometry block wins)

# ── Geometry: SMD converging-diverging nozzle (smoothed C1 throat blend) ───────
# The solver has the SMOOTH variant of the demo's get_nozzle_smd_divergent
# (converging → constant-r throat 0.010065 m → C1 blend → divergent to r_outlet).
geometry:
  # function: get_nozzle_smd_divergent_smooth
  function: get_nozzle_smd_divergent_smooth
  roughness: 0.0

# ── Interphase closure ────────────────────────────────────────────────────────
sources:
  # bubble_number:  1.0e12          # physics (from the demo) — NOT a tuning knob
  # droplet_number: 1.0e10
  bubble_number:  1.5000000000e+11          # physics (from the demo) — NOT a tuning knob
  droplet_number: 1.0e10
  # FLASHING = phase change ON: closure computes evaporation σ_Mg and the source
  # is assembled by D_VE_algebric (mass + momentum + energy transfer).  Needs the
  # saturation props above (use_saturation is driven by this flag).
  mass_transfer: true

# ── Numerics (full certified E3 stack) ────────────────────────────────────────
numerics:
  CFL: 2.0
  newton_iter: 7
  delta_factor: 1e-6              # Harten fix — WATCH the throat sonic cell
  recon: muscl_van_albada         # smooth limiter (flashing front ~ a shock in α;
                                  # C0 limiters flicker-pump the growing ghost)
  k_vm: 0.5
  jacobian: colored
  jacobian_validate: false
  profile: false
  linear_solve: normal_eq_banded
  eos_rows: true                  # E3-augmented system (kills null-space drift;
  eos_rows_banded: true           # essential for a real α-traverse case)
  # linear_solve: lstsq
  # eos_rows_banded: false     # dense E3 path so lstsq is actually used
  jac_lag: 1
  eos_project: false              # obsolete under E3
  nc_form: cell
  nc_scale: 1.0
  # Transonic (the nozzle CHOKES; two-phase Wood speed is low) → FULL acoustic
  # dissipation, as the isentropic/shock cases (lm=0 DIVERGES on compressible
  # flow).  The low-velocity inlet is covered by the velocity-gated eps_void.
  lowmach_diss: 1.0
  lowmach_diss_bc: 1.0
  # JST void filter, velocity-gated: active only in the slow inlet, OFF at the
  # throat/supersonic (u_mat inlet ~ few m/s → throat ~100 m/s; u0=40, Δu=12).
  eps_void: 0.1
  # PROBE 2026-07-21: gate lifted (null = ungated/uniform).  The gas u_g/h_g 2Δx
  # wind-up lives in the strong-flashing region at u>100 m/s where the u-gated
  # filter was OFF.  Restore 70.0 if this probe is negative.
  eps_void_ucut:  null
  eps_void_uwidth: 12.0
  eps_void_scale:  frozen
  eps_ghost: 0.0
  # Band widened 3e-3 → 5e-2 (2026-07-21): the gas-phase h_g/u_g 2Δx mode that
  # kills the flashing march lives at α ≈ 1e-3..1e-2 (onset region) — OUTSIDE
  # the default band, so the certified ghost filter was off exactly where the
  # mode rings.  A/B at SRC_SCALE=0.1: default band died at step 66 (dhg=10).
  eps_ghost_acut: 3.0e-3
  w_char: auto                    # state-derived scaling (flashing-hardened: α 1e-4→~1)
  # Ghost-vapor saturation pin (nozzlex parity): pre-onset the vapor's h_g is
  # blended toward h_sat_g(p) with weight 1−w_evap (the σ gate's complement),
  # so the pin CANNOT block flashing onset (weight is liquid-superheat only).
  # ρ_sat_g follows via the gas EOS row.  Gas momentum NOT pinned (nozzlex
  # didn't need it).  See TODO: verify adequacy for shock-condensation cases.
  pin_ghost: true
  # Ghost-GAS MOMENTUM pin (u_g → u_l), α-gated (releases as α grows past
  # ~10·alpha_eps), saturation-free.  Slaves the free ghost-vapor velocity dof
  # that leads the α_eps=1e-6 crash (gas-momentum 2Δx mode, u_g 98% odd-even).
  # nozzlex constraint 2, which its space-march left commented (no grid mode).
  pin_ghost_momentum: false
  # Solver α clip floor — MUST match ic.alpha_floor.  Default 1e-6 silently
  # undoes the IC floor mid-march (measured: ghost α re-thinned 1e-4 → 1e-6),
  # re-arming the h_g = E/(αρ_g) thin-ghost amplifier at flashing onset.
  # 1e-6 TESTED 2026-07-21 with pin_ghost: FAILS at step ~58 led by GAS MOMENTUM
  # (dug gate 30→68, u_g 2Δx 98%) — the unpinned ghost dof (nozzlex constraint 2,
  # u_v=u_l).  Deep-ghost floor needs the momentum pin — deferred (see TODO).
  alpha_eps: 1.0e-6
  ssr_mode: mass                  # mass-weighted convergence (THE flashing use case)
  du_blend_lo: 5.0
  du_blend_hi: 20.0                # zero-slip flux formulation (near no-slip inlet)

# ── Initial / boundary conditions ─────────────────────────────────────────────
# Reservoir (stagnation) inlet at 120 bar / 578.95 K; the driver builds each
# phase's enthalpy from (p0, T0) via the EOS.  At 578.95 K the liquid is
# subcooled at the inlet (120 bar) and becomes SUPERHEATED as p drops → flashing.
# Characteristic outlet: LODI back-pressure while subsonic, auto-transmissive if
# the divergent goes supersonic.

# ic:
#   type: stagnation # nozzlex_csv                # robust cold-start: p ramp p0→p_out, gentle
#   run: results
#   alpha_floor: 1.0e-6             # thick ghost seed — match numerics.alpha_eps

ic:
  type: restart # nozzlex_csv                # robust cold-start: p ramp p0→p_out, gentle
                                  # slip-consistent velocity, stagnation h.  The
                                  # ramp already puts the downstream liquid into
                                  # the superheated (flashing) regime.
                                  # Alternatives: 'stagnation' (from rest — rougher,
                                  # hits the deferred startup-corner issue) or a
                                  # 'nozzlex' pickle seed.
  run: results_two_phase/smd_supersonic_N100_muscl_van_albada_20260725_100336
  alpha_floor: 1.0e-6             # thick ghost seed — match numerics.alpha_eps


bc:
  inlet:  stagnation
  outlet: characteristic_old

  p0:            12000000.0       # Pa — 120 bar reservoir (shared by both phases)
  T_g0:          578.95           # K  — case "a" inlet temperature
  T_l0:          578.95           # K
  # α_g (vapor) at inlet.  Demo = 1e-6; started at 1e-4 for ghost robustness
  # (see caveat 1).  Liquid-dominant ⇒ this is the flashing "only liquid" inlet.
  void_fraction: 1.0e-3           # match numerics.alpha_eps / ic.alpha_floor —
                                  # an inlet α below the solver clip floor would
                                  # leave a permanent jump at the first interior cell
  slip:          1.0              # S = u_g/u_l  (demo is ~no-slip)
  # Which phase's isentrope pins the shared inlet static p.  'auto' = mass-fraction
  # rule: with α_v=1e-4 the vapor MASS fraction is ~1e-6 → dominant = LIQUID, so p
  # is closed on the (stiff, near-incompressible) LIQUID isentrope s_l(p,h_l)=s_l0,
  # NOT the ill-conditioned ghost-vapor isentrope.  This is the flashing fix.
  dom_phase:     auto             # auto (mass fraction) | gas | liquid

  p_out:       80e5        # Pa — 67.6 bar back-pressure (case "a"); ignored
  p_out_relax:   1.0              #      once the exit goes supersonic

# ── Time-step control (flashing mass transfer is STIFF → adaptive halving) ─────
time_control:
  adaptive_dt:  true
  max_halvings: 8
  dp_max:       0.20
  dh_max:       0.05
  du_max:       0.20
  da_max:       0.10
  dt_grow:      1.20

# ── Run control ───────────────────────────────────────────────────────────────
run:
  n_steps: 20000
  print_every: 50
  ssr_tol: 1.0e-8
  t_end: null
  plateau_window: 4000
  plateau_ratio: 1.01
  visualize_ic: false
  debug_newton: false

save_options:
  repo_main: results_two_phase
  repo_run: fd_nb_hi2
