boundary_conditions:
  p_stagnation: 1.0e5   # = p_L  (waves don't reach boundary during t2)
  T_stagnation: 348.0   # = T_L
  p_out:        1.0e4   # = p_R

numerical_settings:
  Nx: 1000
  x1: 0.0
  x2: 1.0
  t1: 0.00
  t2: 5.4e-4            # physical end time ≈ 0.2/c_L s — waves clear of boundaries
  CFL: 0.05              # FVS Newton is implicit — can go above 0.5; lower = more accurate
  max_iterations: 100000
  residuals: 1.0e-8    # will not converge (transient) — loop runs to t2

  # ── Flux method ────────────────────────────────────────────────────────
  # rusanov | hll | hllc | lf    (JAX path — recommended for shock tube)
  flux_method: hllc

  # ── Time discretization ─────────────────────────────────────────────────
  # euler        — explicit Euler  (fast, reference)
  # fvs_newton   — Städtke FVS + Newton implicit  (requires perfect_gas: false)
  time_discretization: fvs_newton

  # ── Reconstruction ──────────────────────────────────────────────────────
  # Use constant (1st order) first — FVS+MUSCL is not TVD for strong shocks.
  # Switch to muscl_van_leer for smoother profiles once base case passes.
  reconstruction: muscl_van_leer

  # ── Wall friction ────────────────────────────────────────────────────────
  # false = frictionless (Sod shock tube has no pipe wall, tau_w must be zero)
  # true  = Haaland friction (default for nozzle cases)
  wall_friction: false

geometry:
  function: get_shock_tube
  roughness: 0.0
  area: 1.0             # constant cross-section [m²]

shock_tube:
  x_diaphragm: 0.5
  p_L: 1.0e5            # Pa
  T_L: 348.0            # K   → rho_L ≈ 1.0 kg/m³ for Air
  u_L: 1.0e-6              # m/s — must be nonzero for FVS (K-matrix singular at u=0)
  p_R: 1.0e4            # Pa
  T_R: 278.0            # K   → rho_R ≈ 0.125 kg/m³ for Air
  u_R: 1.0e-6              # m/s — must be nonzero for FVS

fluid:
  perfect_gas: false    # fvs_newton requires real-gas EOS (perfect_gas not supported)
  fluid_name: Air
  use_lookup_table: true
  lut:
    backend:   HEOS
    h_min:     100000.0   # J/kg  →  T ~ 100 K
    h_max:     500000.0   # J/kg  →  T ~ 500 K
    p_min:     1000.0     # Pa
    p_max:     500000.0   # Pa
    N_h:       100
    N_p:       60
    table_dir: fluid_tables
