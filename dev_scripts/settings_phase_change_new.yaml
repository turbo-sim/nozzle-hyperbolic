# ─────────────────────────────────────────────────────────────────────────────
# PHASE-CHANGE pipe — MODERNISED config (2026-07-18).
#
# Same physics as settings_phase_change.yaml (120 bar water pipe, superheated /
# metastable liquid driven toward saturation by evaporation) but wired to the
# FULL certified numerics stack the older driver silently dropped:
#   E3-augmented system (eos_rows + banded) + guarded jac_lag  — the null-space
#     fix (kills m_l drift / N500 SSR floor / CFL ceiling; certified on the
#     two-component anchor SSR 3.9e-5 → 3.2e-7),
#   w_char: auto                                                — flashing-safe
#     state-dependent column scaling (α 1e-4→0.9 traverse; local rolling max),
#   ssr_mode: mass                                              — mass-weighted
#     convergence votes (pure measurement, general form when α varies),
#   nc_form: cell                                               — the settled
#     quasi-1D area convention (quasi1d_area_treatment.md),
#   lowmach_diss + eps_void                                     — the
#     dissipation the old driver never passed through.
#
# WITH vs WITHOUT phase change = the single `sources.mass_transfer` toggle:
#   true  → D_VE_algebric (drag + heat + evaporation);  liquid relaxes to T_sat.
#   false → D_VE_algebric_two_component (drag + heat only); metastable liquid
#           stays metastable (the two-component control run).
#
# eps_ghost is OFF and stays off: this is a REAL two-phase case (α≈0.1, both
# phases carry mass), so the entire ghost-limit pathology class (v1-v6 saga) is
# absent by construction — no crutch needed.
# ─────────────────────────────────────────────────────────────────────────────

fluid:
  name: water

# ── EOS look-up tables (unchanged from settings_phase_change.yaml) ────────────
eos:
  gas:
    backend: HEOS
    h_min: 2200000.0
    h_max: 3400000.0
    p_min: 2000000.0
    p_max: 18000000.0
    N_h: 80
    N_p: 80
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: vapor
    gradient_method: forward
  liquid:
    backend: HEOS
    h_min: 800000.0
    h_max: 1800000.0
    p_min: 2000000.0
    p_max: 18000000.0
    N_h: 80
    N_p: 80
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: liquid
    gradient_method: forward

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  Nx: 200
  x1: 0.0
  x2: 1.0
  radius: 0.01

# ── Geometry: constant-area pipe (G = 0 → area source is a no-op) ─────────────
geometry:
  function: get_pipe
  roughness: 0.0
  radius: 0.01

# ── Initial condition: uniform superheated (metastable) liquid, 120 bar ───────
ic:
  type: uniform          # uniform | riemann | nozzlex | restart
  uniform:
    p:          12000000.0  # Pa (120 bar)
    alpha_g:    0.1         # 10 % vapour by volume
    u_g:        100.0
    u_l:        100.0
    h_g_offset: 0.0         # gas at saturation
    h_l_offset: 100000.0    # liquid 100 kJ/kg above sat → metastable superheated
  nozzlex:
    T0_in:  578.95
    solver: Kvaerno5
    nsteps: 2000
    n_eval: 200
    Ma_in:  0.01
    rtol:   1.0e-6
    atol:   1.0e-6
  # restart: seed from a previous run's solution.csv (interp if Nx differs);
  # the cheap way to sweep a back-pressure or flip mass_transfer near a settled
  # state instead of a cold start.
  restart:
    run: null              # e.g. results/phase_change_N200_..._<stamp>

# ── Interphase-structure closure ──────────────────────────────────────────────
sources:
  bubble_number:  1.0e10
  droplet_number: 1.0e8
  # ►►► WITH / WITHOUT phase change — the toggle:
  #   true  = evaporation ON  (D_VE_algebric, single-component, needs sat props)
  #   false = drag + heat only (D_VE_algebric_two_component, no phase change)
  mass_transfer: true

# ── Numerical parameters (the full certified stack) ───────────────────────────
numerics:
  CFL: 5.0
  newton_iter: 8
  delta_factor: 1e-6
  recon: muscl_van_albada    # ε-regularised (smooth-limiter; van_leer was fine on
                             # the two-component Elliot case but albada is the
                             # robust default — flicker was ghost-noise-specific)
  k_vm: 0.5
  jacobian: colored
  jacobian_validate: false
  profile: false
  # E3-augmented system + O(N) banded solve + guarded Jacobian lagging.
  linear_solve: normal_eq_banded
  eos_rows: true
  eos_rows_banded: true
  jac_lag: 10
  eos_project: false         # obsolete under E3 (the EOS rows ARE the projection)
  # Area / non-conservative convention (settled: quasi1d_area_treatment.md).
  nc_form: cell
  nc_scale: 1.0
  # Two-phase mixture has a LOW Wood sound speed → compressible even at u~100 m/s
  # → full acoustic dissipation (as isentropic/shock cases; NOT the Bernoulli
  # incompressible-limit lm=0).  Revisit if a low-Mach checkerboard appears.
  lowmach_diss: 1.0
  # lowmach_diss_bc: 1.0     # SET THIS if you switch outlet → pressure (stiff BC
                             # enforcement on the boundary faces).  Moot for the
                             # transmissive outlet below.
  # JST void filter: UNGATED here (no eps_void_ucut) — a uniform-velocity pipe at
  # u~100 m/s would disable a velocity-gated filter everywhere.  With lowmach_diss
  # 1.0 already dissipative this may be reducible; sweep and confirm ε-independence.
  eps_void: 0.1
  eps_void_scale: wood
  # eps_ghost: 0.0           # OFF — real two-phase, no ghost (default 0.0)
  # General state-derived column scaling (flashing-hardened).
  w_char: auto
  # Mass-weighted SSR votes (general form when α varies; pure measurement).
  ssr_mode: mass
  # Zero-slip flux blend window [m/s] (drag pins du small at the inlet).
  du_blend_lo: 1.0e-2
  du_blend_hi: 1.0e-1

# ── Boundary conditions ───────────────────────────────────────────────────────
# Demo setup preserved: fixed static inlet (pins all 6 vars incl. p — reflective
# but stable, good for validation), transmissive outlet.  For a back-pressure-
# driven pipe switch outlet → pressure and set lowmach_diss_bc: 1.0 above.
bc:
  inlet:  static_state
  outlet: transmissive
  p_out:  11808888.60
  p_out_relax: 1.0

# ── Time-step control ─────────────────────────────────────────────────────────
time_control:
  adaptive_dt:  true
  max_halvings: 8
  dp_max:       0.20
  dh_max:       0.01
  du_max:       0.20
  da_max:       0.10
  dt_grow:      1.20

# ── Run control ───────────────────────────────────────────────────────────────
run:
  n_steps: 10000
  print_every: 10
  ssr_tol: 1.0e-8
  t_end: null
  plateau_window: 6000
  plateau_ratio: 1.01
  visualize_ic: false
  debug_newton: false
