boundary_conditions:
  p_stagnation:  130e5
  T_stagnation: 348
  p_out: 15e5
 
# Numerical settings
numerical_settings:
  Nx: 200 # Number of cells
  x1: -0.03201  # Left boundary
  x2: 0.06636   # Right boundary
  t1: 0.00  # Initial time
  t2: 120  # Final time
  CFL: 10 # Maximum allowed local Courant number
  max_iterations: 1000
  residuals: 1e-5
  # ── Flux method ────────────────────────────────────────────────────────
  # rusanov | hll | hllc | lf    (JAX, real gas)
  # roe                           (NumPy, real gas)
  # NOTE: ignored when time_discretization is fvs_newton
  flux_method: hllc

  # ── Time discretization ─────────────────────────────────────────────────
  # euler           — explicit forward Euler            (JAX/NumPy)
  # RK3             — SSP Runge-Kutta 3rd order         (JAX/NumPy)
  # RK4             — classic 4th-order Runge-Kutta     (JAX/NumPy)
  # implicit        — diagonal implicit (pseudo-time)   (JAX/NumPy)
  # fvs_newton  — Städtke FVS + full Newton-Raphson (JAX, real gas only)
  #                   Works in (p,u,h) primitives; flux_method is ignored.
  #                   Jacobian via jax.jacobian; 3 Newton iters/step.
  #                   linear_solver: banded makes the Newton solve O(N)
  #                   (dense: O(N^3), keep Nx <= 500). CFL can be raised to 5-10.
  # time_discretization: implicit
  time_discretization: fvs_newton

  # ── Wall friction ────────────────────────────────────────────────────────
  # true  = Haaland pipe friction on momentum (default)
  # false = frictionless duct (shock tube validation)
  wall_friction: true

  # ── Reconstruction ──────────────────────────────────────────────────────
  # constant | muscl_minmod | muscl_van_leer | muscl_superbee
  # NOTE: ignored for fvs_newton (always uses Van Leer in (p,u,h))
  # NOTE: MUSCL + euler requires CFL <= 0.5
  reconstruction: muscl_van_albada
  delta_factor: 1e-6    # global floor on eigenvalue smoothing; 1e-12 makes Jacobian blind at shock → dt collapse
  newton_iter:  5

  # ── Warmup (JAX path only, not fvs_newton) ──────────────────────────
  # Omit this block to skip warmup entirely.
  # warmup:
  #   n_iterations: 100
  #   flux_method: rusanov
  #   reconstruction: constant
  #   CFL: 20
  initialization: simple

  jacobian: colored 

  # -- Speed-up switches (SPEEDUP_REPORT_FVS_SINGLE_PHASE.md) ---------------
  # Key absent = original code path.  The values below change the result only
  # at round-off (<= 1e-10); ser_beta > 0 changes the path to the steady state
  # (steady cases only, never for transients).
  linear_solver: banded     # dense | banded (O(N) block-tridiagonal LU)
  newton_tol: 1.0e-8        # 0 = always newton_iter Newton iterations
  flux_local_jac: true      # per-face local Jacobian (custom JVP)
  cell_local_jac: true      # per-cell EOS local Jacobian (custom JVP)
  fast_increments: true     # jitted dp/dh/du step check in the driver
  ser_beta: 0.0             # 1.0 = SER CFL ramp CFL*(SSR_1/SSR)^beta
  ser_cfl_max: 50.0         # cap of the ramp (500 cycled on HEM N=500)
  cpu_affinity: "0-15"      # P-cores of this laptop; null = no pinning

 
geometry:
  function: get_lettieri_nozzle
  roughness: 0.0
  # area: 1.0 
 
fluid:
  perfect_gas: false
  fluid_name: CO2
  use_lookup_table: true   # true = FluidBicubic (fast, requires table build);
                           # false = jxp.Fluid  (direct HEOS, slower, no table needed)
  lut:                     # only used when use_lookup_table: true
    backend:   HEOS
    h_min:     50000.0     # J/kg
    h_max:     850000.0    # J/kg
    p_min:     10000.0     # Pa
    p_max:     30000000.0  # Pa
    N_h:       80
    N_p:       80
    table_dir: fluid_tables

