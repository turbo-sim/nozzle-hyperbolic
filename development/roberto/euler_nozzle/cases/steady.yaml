# Baseline of the current production kernels, before the shared-engine migration.
schema_version: 1
problem: steady_nozzle
# Legacy solver nodes include two boundary slots. These give 49/99/199/399
# physical points and place a node exactly at the throat, as in the old example.
grid_points: [51, 101, 201, 401]
reconstructions: [constant, muscl_van_leer]
max_updates: 5000
spatial_rms_tolerance: 1.0e-8
accuracy:
  normalized_mean_absolute_error: 0.03
  relative_boundary_mass_imbalance: 1.0e-4
# Geometry, reservoir, EOS and Newton/SER settings are imported from the
# established verify_euler_nozzle_steady.py baseline, not redefined here.
cases:
  - {id: subsonic, label: Subsonic throughout, condition: throat_mach, value: 0.60}
  - {id: sonic_limit, label: Exactly sonic throat / subsonic exit, condition: critical}
  - {id: shock_35, label: Shock at 35% of divergence, condition: shock_fraction, value: 0.35}
  - {id: shock_70, label: Shock at 70% of divergence, condition: shock_fraction, value: 0.70}
  - {id: shock_exit, label: Shock exactly at exit, condition: shock_exit}
  - {id: overexpanded, label: Below shock-at-exit pressure / overexpanded, condition: external_midpoint}
  - {id: adapted, label: Exactly adapted exit pressure, condition: adapted}
  - {id: underexpanded, label: Below adapted pressure / underexpanded, condition: adapted_factor, value: 0.5}
