boundary_conditions: 
  p_stagnation: 6e5
  T_stagnation: 500
  p_out: 0.1e5

# Numerical settings
numerical_settings:
# Define the grid
  Nx: 250 # Number of cells
  x1: 0.00  # Left boundary
  x2: 1.0  # Right boundary
  t1: 0.00  # Initial time
  t2: 0.1  # Final time
  CFL: 0.2 # Maximum allowed local Courant number

nozzle_geometry:
# Define nozzle area
  r0: 0.30
  rt: 0.10


# rt1 = 0.2
# rt2 = 0.15
# rt3 = 0.10