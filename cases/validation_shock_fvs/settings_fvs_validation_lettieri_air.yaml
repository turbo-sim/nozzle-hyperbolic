# -----------------------------------------------------------------------------
# Single-phase FVS validation: normal shock in the Lettieri nozzle, Air (LUT).
# Driven by validation_fvs_shock_nozzle.py (NOT main.py): for each fraction in
# validation.shock_fractions the script computes the exact quasi-1D solution
# with the same EOS (nozzle_exact_real_gas), takes the back pressure that holds
# the shock at x_s = x_throat + f*(x_exit - x_throat), runs fvm_euler_1d with it
# and plots the numerical vs exact profiles.
#
# Air at 2 bar / 295.15 K: near-ideal (exact solution within ~5e-4 of the
# perfect-gas area-Mach + normal-shock relations).  Lettieri nozzle:
# A_in/A* = 17.1, A_exit/A* = 1.69 (supersonic exit M = 2.0), throat at
# x/L = 0.325.
#
# Keep this file pure ASCII (read on Windows without an explicit encoding).
# -----------------------------------------------------------------------------

boundary_conditions:
  p_stagnation: 2.0e5    # Pa
  T_stagnation: 295.15   # K
  p_out: null            # set per case from the exact solution

validation:
  shock_fractions: [0.25, 0.50, 0.75]  # shock position / divergent-section length
  n_exact: 1201                        # stations of the exact curves in the plot
  markers: 25                          # numerical markers per curve in the plot

numerical_settings:
  Nx: 300
  x1: -0.03201           # Lettieri geometry data: x = -0.03201 .. 0.06636 m
  x2: 0.06636
  t1: 0.00
  t2: 100.0              # large - the residual criterion stops the run
  CFL: 0.5
  max_iterations: 20000
  residuals: 1.0e-8

  flux_method: hllc # ingnored when fvs_newton is active
  time_discretization: fvs_newton
  initialization: simple
  reconstruction: muscl_van_leer
  delta_factor: 1e-6
  newton_iter: 8         # cap; newton_tol stops earlier
  jacobian: colored
  jacobian_validate: false
  adaptive_dt: true
  wall_friction: false   # inviscid, as the exact solution
  eps_filter: 0.0

  # Speed-up switches (SPEEDUP_REPORT_FVS_SINGLE_PHASE.md)
  linear_solver: banded
  newton_tol: 1.0e-8
  flux_local_jac: true
  cell_local_jac: true
  fast_increments: true
  ser_beta: 1.0          # SER CFL ramp (steady state only) | The CFL increase is based on the SSR
  ser_cfl_max: 50.0
  # cpu_affinity: "0-15"   # P-cores

geometry:
  function: get_lettieri_nozzle   # reads Lettieri_nozzle.xlsx (cwd = dev_scripts)
  roughness: 0.0

fluid:
  perfect_gas: false
  fluid_name: Air
  use_lookup_table: true
  lut:                   # same table as settings_nozzle_validation.yaml (Air_100x80)
    backend:   HEOS
    h_min:     150000.0
    h_max:     500000.0
    p_min:     5000.0
    p_max:     500000.0
    N_h:       100
    N_p:       80
    table_dir: fluid_tables
