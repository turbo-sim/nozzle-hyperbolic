# Provenance record for one publication. See ../../SCHEMA.md for the field contract.
# Top-level scalars only -- scripts/build_index.py parses this without PyYAML.

bibkey: abuaf1981
fluid: Water

# The BNL work was published as a NUREG/BNL report, which has no DOI.
# Leave `doi` empty rather than inventing one; `report_id` is the findable identifier.
doi:
report_id: NUREG/CR-1864 (BNL-NUREG-51317)

reference: "N. Abuaf, O. C. Jones Jr., B. J. C. Wu, Study of Nonequilibrium Flashing of Water in a Converging-Diverging Nozzle, Volume 1: Experimental, Brookhaven National Laboratory, NUREG/CR-1864, 1981."

# Where x = 0 sits. Mandatory: a digitised axial coordinate is meaningless without it.
x_origin: "throat, positive downstream (converging section has x < 0)"
x_units_original: mm

digitizer: "TODO -- name, tool and date, e.g. 'A. Bergamin, WebPlotDigitizer 4.7, 2026-08-28'"
verified_by:

notes: |
  STATUS: SCAFFOLD. The folder structure, column names, units and provenance fields are
  real; every numeric row is marked status=placeholder and must be replaced by values read
  off the actual report before this source is used for validation.

  To fill in, the following must be taken from the report and not from secondary sources:
    - the nozzle wall coordinates (report the throat diameter and the divergence half angle
      alongside the digitised curve, and note any disagreement between them)
    - the inlet stagnation conditions per run, and whether the reported inlet pressure is
      stagnation or static (this differs between tables in the BNL series)
    - the axial pressure taps: their x locations are tabulated, so use the table rather than
      digitising tap positions off a figure
    - whether the run was choked, and the reported mass flow rate

  Known things to watch for in this data set:
    - inlet conditions are subcooled liquid; the flashing inception point sits downstream of
      the throat and the pressure undershoot below saturation is the quantity of interest,
      so the pressure resolution near the throat matters more than anywhere else
    - some figures in the report plot gauge pressure; convert to absolute and record the
      original unit in a '#' comment in the profile file
