# ─────────────────────────────────────────────────────────────────────────────
# CASE C — TWO-PHASE inlet, 5 % vapour quality, both phases at EQUILIBRIUM
# R1233zd(E) flashing expansion, Elliot nozzle, six-equation two-fluid model
#
#   reservoir  equilibrium two-phase at 155 degC -> p0 = p_sat = 29.8309 bar
#              BOTH phases on the saturation line (T_g0 = T_l0 = T_sat(p0)),
#              which is exactly what "at equilibrium" means: equal temperature,
#              equal pressure, each phase on its own saturation branch.
#   inlet      x = 0.05 by MASS  ->  alpha_g = 0.1516 by VOLUME
#   outlet     p_out = 2 bar
#
# Unlike cases A and B the vapour here is a REAL phase carrying real mass, not a
# thin ghost.  Two consequences, both handled below:
#
#   1. alpha_eps is set EXPLICITLY, not 'match_void'.  match_void ties the solver
#      clip floor to the inlet void fraction, which is right for a ghost (where
#      the inlet alpha IS the floor) but would here pin the floor at 0.1516 —
#      alpha could then never fall below that anywhere in the nozzle.  The loader
#      rejects match_void above alpha = 1e-2 for this reason.
#
#   2. The mixture sound speed at alpha ~ 0.15 is already low (tens of m/s), so
#      the nozzle chokes even more readily than in cases A and B.  Expect a
#      choked, supersonic-exit solution.
#
# Worth an A/B test here: numerics.pin_ghost blends the gas energy toward
# h_sat_g(p) wherever the liquid is NOT superheated.  That is the right thing for
# a ghost and consistent with an equilibrium inlet, but with a real vapour phase
# it suppresses genuine vapour superheat in any condensing region.  Try
# pin_ghost: false and compare.
#
# One of three inlet-condition variants — see settings_saturated_liquid.yaml.
# ─────────────────────────────────────────────────────────────────────────────

fluid:
  name: R1233ZDE          # registered CoolProp alias of canonical "R1233zd(E)"

# ── EOS tables ────────────────────────────────────────────────────────────────
# p_max: critical  ->  resolved to the CoolProp critical pressure (36.2369 bar).
#
# CAUTION, enthalpy is REFERENCE-STATE dependent and the two CoolProp builds on
# this machine disagree for R1233zd(E) by ~31.6 kJ/kg:
#     CoolProp 7.2.0 (poetry venv, the one that runs this):  h_l,sat(155C)=416.0
#     CoolProp 6.6.0 (base conda env):                       h_l,sat(155C)=447.6
# The bounds below are in the 7.2.0 frame.  build_tables.py prints the version
# and re-derives every bound from it, so a mismatch shows up as a failed check.
eos:
  gas:                            # metastable VAPOUR — the ghost that grows
    fluid_name: R1233ZDE
    backend: HEOS
    h_min: 250000.0               # J/kg
    h_max: 550000.0               # J/kg
    p_min: 100000.0               # Pa  (0.1 MPa)
    p_max: critical               # Pa  (critical pressure)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables       # relative to this case folder
    metastable_phase: vapor
    gradient_method: forward
  liquid:                         # metastable LIQUID — the dominant flashing phase
    fluid_name: R1233ZDE
    backend: HEOS
    h_min: 200000.0               # J/kg
    h_max: 450000.0               # J/kg
    p_min: 100000.0               # Pa  (0.1 MPa)
    p_max: critical               # Pa  (critical pressure)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: liquid
    gradient_method: forward

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  Nx: 200
  x1: 0.0
  x2: 0.31        # m — Elliot total length is 0.31966 m; 0.31 stays strictly
                  #     inside the last (divergent) segment definition

# ── Geometry ──────────────────────────────────────────────────────────────────
geometry:
  function: get_nozzle_elliot
  roughness: 0.0

# ── Interphase closure ────────────────────────────────────────────────────────
sources:
  # COMMON VALUE ACROSS ALL THREE INLET CASES (1e13).  A sensitivity study needs
  # the same closure everywhere, or differences cannot be attributed to the inlet.
  # Finding it required understanding that case A has TWO distinct failure modes,
  # which is why a naive Nb scan looks non-monotonic:
  #     A @ 1e12 -> THERMODYNAMIC failure: liquid reaches the spinodal (cell 93
  #                 frozen).  Immovable - the internal expansion is set by the
  #                 AREA RATIO because the nozzle chokes at any pressure ratio,
  #                 so no back-pressure ladder can soften it (verified: even
  #                 p_out = 28 bar still drops the interior to 17.7 bar).
  #     A @ 1e14 -> NUMERICAL failure: ghost blow-up, h_g -> -2.1e5 kJ/kg with
  #                 98 % odd-even on du while alpha never grew past 0.0017.
  # The second is a void/ghost checkerboard mode, so eps_void 0.02 -> 0.2 (which
  # case C needed anyway) removes it and opens the window.  Measured, all with
  # eps_void = 0.2:
  #     Nb     A                B                C
  #     1e12   NaN step 58      converged        NaN step 816
  #     1e13   CONVERGED        CONVERGED        CONVERGED      <-- the overlap
  #     1e14   converged        NaN step 803     converged
  #     1e15   converged        diverged         converged
  # NOTE Nb is PHYSICS, not a numerical knob: moving 1e13 -> 1e15 changes mdot by
  # ~9 % and the alpha profile by ~17 % (L2).  Calibrate against flashing data for
  # R1233zd(E) if you have it; until then the three cases at least share it.
  bubble_number:  1.0e13
  droplet_number: 1.0e10
  mass_transfer: true             # single component WITH phase change

# ── Numerics (the flashing-certified stack) ───────────────────────────────────
numerics:
  CFL: 2.0
  newton_iter: 5
  delta_factor: 1.0e-6
  recon: muscl_van_albada
  k_vm: 0.5
  jacobian: colored
  linear_solve: normal_eq_banded
  eos_rows: true                  # E3-augmented system
  eos_rows_banded: true           # O(N) banded twin
  jac_lag: 1
  eos_project: false              # obsolete under E3
  proj_s_ref: 2.0e-2
  nc_form: wb                     # well-balanced non-conservative term
  nc_scale: 1.0
  lowmach_diss: 1.0               # transonic — full acoustic dissipation
  lowmach_diss_bc: null
  # JST void-fraction filter.  0.02 (cases A/B) is tuned for a THIN GHOST, where
  # the void mode is passive.  Here alpha traverses 0.15 -> 0.96, straight through
  # the alpha ~ 0.5 minimum of the Wood sound speed, so the void/slip modes carry
  # real acoustic energy and 0.02 does not hold them: the baseline diverged at
  # step 433 with checkerboard on every field and a nonsense max Mach of 72
  # (a_mix collapsing locally).  Measured ladder at this inlet:
  #     eps_void 0.02, pin_ghost true   -> NaN at step 433
  #     eps_void 0.02, pin_ghost false  -> NaN at step 642 (Mach sane again)
  #     eps_void 0.2,  pin_ghost true   -> converges
  # Being a 4th-order filter it perturbs a smooth solution only at O(eps*dx^3);
  # sweep it (0.1 / 0.2 / 0.4) to confirm the answer is eps-independent.
  eps_void: 0.2                   # 0.2 for ALL cases (see bubble_number note)
  eps_void_ucut: null             # ungated
  eps_void_uwidth: 12.0
  eps_void_scale: frozen
  eps_ghost: 0.0
  eps_ghost_acut: 3.0e-3
  eps_ghost_awidth: 0.25
  eps_ghost_k2: 0.0
  eps_ghost_alo: 1.0e-5
  w_char: auto
  pin_ghost: true                 # ghost-vapour saturation pin
  pin_ghost_momentum: true        # ghost momentum pin (u_g -> u_l)
  # Solver void clip floor — EXPLICIT here, not 'match_void'.  The inlet void
  # fraction is 0.1516, so match_void would make that the floor and alpha could
  # never drop below it anywhere in the nozzle (the loader rejects it above 1e-2).
  # 1e-3 keeps the same protection cases A and B rely on: it is far enough above
  # zero that the h_g = E_g/(alpha rho_g) amplifier cannot arm if a cell locally
  # drains of vapour, and far enough below 0.1516 not to constrain the solution.
  alpha_eps: 1.0e-3
  ssr_mode: mass                  # mass-weighted convergence
  du_blend_lo: 5.0
  du_blend_hi: 20.0

# ── Initial condition ─────────────────────────────────────────────────────────
ic:
  type: stagnation                # uniform field at rest at reservoir conditions

# ── Boundary conditions ───────────────────────────────────────────────────────
bc:
  inlet:  stagnation
  outlet: characteristic

  # ── Reservoir (stagnation) state ────────────────────────────────────────────
  # One pressure shared by both phases plus a per-phase temperature — the same
  # keys as dev_scripts/settings_*.yaml.
  #
  # p0 accepts a number in Pa, or the keyword `saturation`, which resolves to
  # p_sat(T_l0).  Use the keyword when you mean "the liquid sits exactly on the
  # saturation line" — writing the number by hand is fragile, because a value a
  # few Pa off flips the reservoir to subcooled or two-phase.
  # Both phases at the SAME temperature, on the saturation line at p0 = p_sat of
  # that temperature.  That is thermodynamic equilibrium: the loader takes the
  # liquid from Q=0 and the vapour from Q=1, so T_l0 = T_g0 = T_sat(p0) and the
  # two enthalpies are the two ends of the tie line.
  p0:   saturation                # -> p_sat(T_l0) = 29.8309 bar
  T_g0: 428.15                    # K  (155.00 degC) = T_sat(p0)
  T_l0: 428.15                    # K  (155.00 degC) = T_sat(p0)
  #
  # How the reservoir enthalpies are obtained (the driver reports which branch it
  # used for each phase):
  #   T <  T_sat(p0)  -> subcooled liquid   : ordinary (p,T) flash
  #   T >  T_sat(p0)  -> superheated vapour : ordinary (p,T) flash
  #   T == T_sat(p0)  -> ON the saturation line, where a (p,T) flash is AMBIGUOUS
  #                      (both branches are valid roots) -> the liquid is taken
  #                      from Q=0 and the vapour from Q=1.
  # Separately, for a SUBCOOLED reservoir the (p,T) flash returns the LIQUID
  # branch for the gas phase too, putting h_g below the vapour table floor; the
  # driver then falls back to saturated vapour at p0 (same fix as main).

  # ── Composition ─────────────────────────────────────────────────────────────
  # Give EITHER quality (gas MASS fraction) OR void_fraction (gas VOLUME
  # fraction); the other follows from the slip relation
  #     alpha = 1 / (1 + ((1-x)/x) * (rho_g/rho_l) * S)
  # Setting both is an error.  This case is naturally stated as a QUALITY (a mass
  # fraction), so void_fraction is left null and the loader derives
  #     alpha_g = 0.151578   from   x = 0.05, rho_g/rho_l = 224.417/761.784, S = 1
  quality:       0.05             # gas MASS fraction at the inlet
  void_fraction: null             # derived -> alpha_g = 0.1516
  slip:          1.0              # S = u_g/u_l
  dom_phase:     auto             # auto (mass fraction) | gas | liquid

  p_out: 2.0e5                    # Pa — 2 bar back-pressure
  # Outlet back-pressure under-relaxation:
  #     p_ghost = p_last + w * p_out_relax * (p_out - p_last)
  # The STEADY STATE is unchanged by this (at convergence p_last -> p_out makes
  # the blend exact); it only sets the startup path, which is the whole
  # difficulty here.  The liquid must FLASH to shed enough enthalpy to stay on
  # the live side of the spinodal as p falls, and flashing is finite-rate:
  #     1.0   -> NaN at step 2   (exit cell dropped 29.83->2 bar in one step)
  #     0.05  -> NaN at step 7   (startup rarefaction front past the spinodal)
  #     0.002 -> marches cleanly, dt holds at the CFL cap
  # Note it is applied per STEP, not per unit time: if the controller starts
  # halving dt the boundary forcing per unit PHYSICAL time goes up, a feedback
  # it cannot win.  dt holding at the cap is the signal the value is right.
  p_out_relax: 0.002

# ── Back-pressure continuation ────────────────────────────────────────────────
# Stages are marched to steady state in order, each warm-started from the last;
# every stage costs one retrace (p_out is a compile-time constant in the solver).
#
# A SINGLE stage at the design back-pressure is correct here, and this is
# counter-intuitive: intermediate back-pressures are HARDER than the target.  The
# two-phase Wood speed is tiny (tens of m/s at alpha ~ 0.7) so the nozzle chokes
# at essentially any pressure ratio — p_out = 25 bar (p0/p_out = only 1.19)
# already gives a choked flow with a standing SHOCK in the divergent and
# condensation behind it, the hardest regime this solver handles.  At 2 bar the
# nozzle runs supersonic at the exit with no shock to hold.  A ladder would just
# force the solution through the hard states on the way to the easy one.
continuation:
  stages: []                      # intermediate back-pressures; bc.p_out is appended
  ssr_tol_stage: 1.0e-5           # looser tolerance for intermediate stages
  n_steps_stage: 2000

# ── Time-step control ─────────────────────────────────────────────────────────
time_control:
  adaptive_dt: true
  max_halvings: 8
  dp_max: 0.20
  dh_max: 0.05
  du_max: 0.20
  da_max: 0.10
  dt_grow: 1.20
  dt_floor_frac: 1.0e-3           # floor dt = this * CFL cap
  floor_stall_steps: 500          # consecutive floored steps w/o SSR progress -> bail

# ── Run control ───────────────────────────────────────────────────────────────
run:
  n_steps: 20000
  print_every: 50
  ssr_tol: 1.0e-8
  t_end: null
  plateau_window: 600
  plateau_ratio: 1.01
  visualize_ic: false
  debug_newton: false
  src_scale: 1.0                  # physical source scaling (1 = on)
  area_src: true                  # quasi-1D area source
  dom_only_dt: true               # gate adaptive dt on the DOMINANT phase only

# ── Output ────────────────────────────────────────────────────────────────────
save_options:
  repo_main: results
  repo_run: r1233zde_quality05
