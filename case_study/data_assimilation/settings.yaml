# ─────────────────────────────────────────────────────────────────────────────
# CO2 expansion through the inverse-designed nozzle - six-equation two-fluid model
#
#   design     nozzlex examples/inverse_design (HEM, frictionless), case 3:
#              120 bar / 310.15 K -> 30 bar, exported as a circular nozzle,
#              L = 1 m, D_in 52.1 mm, D_throat 20.0 mm (x = 0.485 m), D_out 31.2 mm
#   reservoir  supercritical CO2, 120 bar / 37 degC (p0/p_c = 1.63, T0/T_c = 1.02),
#              liquid-like: h0 = 286.2 kJ/kg, s0 = 1260.9 J/kg/K, rho0 = 748 kg/m3
#   expansion  the reservoir isentrope enters the dome at ~65.6 bar (T/T_c ~ 0.985);
#              HEM equilibrium quality at 30 bar = 0.33
#   model      single component, mass transfer ON, vapour grows from a ghost
#   start      cold start from rest, outlet ramped p0 -> p_out (cold-start defaults)
#
#     python main.py            (from this folder, poetry venv)
#
# Supercritical inlet - how it is handled:
#   * the saturation table ends at 0.98 p_c (72.3 bar); above it jaxprop's
#     get_state_saturation is clamped to the table-top values (was NaN)
#   * sources.p_phase_change_max = 0.95 -> no phase change at p >= 70.1 bar.
#     Physically none is possible above 67.96 bar anyway: the liquid h cannot
#     exceed H0 = 286.2 kJ/kg and h_sat_l(p) > H0 there.  The driver prints
#     this bound and warns if the cut-off falls below it.
#   * the ghost vapour is saturated vapour at min(p0, table top) at the inlet,
#     consistent with the ghost pin (h_g -> h_sat_g, clamped) in the cells.
# ─────────────────────────────────────────────────────────────────────────────
base: defaults_flashing.yaml   # -> defaults_flashing -> defaults

fluid:
  name: CO2

# ── EOS tables ────────────────────────────────────────────────────────────────
# Built into ./fluid_tables on the first run.  Bounds from CoolProp 7.2 (default
# CO2 reference state):
#   p   10 .. 130 bar      covers p0 = 120 bar and an exit below p_out = 30 bar
#                          (triple point 5.18 bar)
#   liquid h 100 .. 320    h_sat,l(10 bar) = 112.7, reservoir h0 = 286.2 kJ/kg
#   vapour h 250 .. 480    h_sat,g <= 437.1 kJ/kg below p_c; the inlet ghost is
#                          h_sat,g(72.3 bar) = 363.9 kJ/kg
eos:
  gas:                              # CO2 metastable VAPOUR (the ghost that grows)
    fluid_name: CO2
    backend: HEOS
    h_min: 250000.0     # J/kg
    h_max: 480000.0     # J/kg
    p_min: 1000000.0    # Pa  (10 bar)
    p_max: 13000000.0   # Pa  (130 bar)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: vapor
    gradient_method: forward
  liquid:                           # CO2 metastable LIQUID (the dominant flashing phase)
    fluid_name: CO2
    backend: HEOS
    h_min: 100000.0     # J/kg
    h_max: 320000.0     # J/kg
    p_min: 1000000.0    # Pa  (10 bar)
    p_max: 13000000.0   # Pa  (130 bar)
    N_h: 90
    N_p: 90
    N_p_sat: 150
    table_dir: fluid_tables
    metastable_phase: liquid
    gradient_method: forward

# ── Grid ──────────────────────────────────────────────────────────────────────
grid:
  Nx: 200                           # cold start: the p_out ramp is sized for N ~ 100
  x1: 0.0
  x2: 1.0                           # m - the exported geometry spans [0, 1] m

# ── Geometry ──────────────────────────────────────────────────────────────────
geometry:
  function: get_nozzle_from_csv
  file_path: design_case4/nozzle_geometry_case_4.csv # case
  roughness: 0.0                  

# ── Interphase closure ────────────────────────────────────────────────────────
sources:
  bubble_number:  1.0e12            # same as the SMD / nitrogen flashing cases
  droplet_number: 1.0e10
  p_phase_change_max: 0.95          # x p_crit = 70.1 bar: no phase change above
  interfacial_area: segments
  interfacial_area_params:
    d_min: 1.0e-5
    ai_pts: [100.0, 6500.0, 22000.0, 12000.0, 5000.0, 100.0]
  regime_htc: true
  regime_blend: smoothstep

# ── Numerics: cold-start defaults, plus the ghost momentum pin every recent
#    flashing case uses ─────────────────────────────────────────────────────────
numerics:
  pin_ghost_momentum: true
  lowmach_diss_bc: 0.0
  CFL: 0.5
  eps_void: 0.25
  eps_ghost: 0.25
  alpha_eps: 1.0e-8
  eps_ghost_alo: 1.0e-8
  pin_mom_alpha: 1.0e-4

# ── Boundary conditions ───────────────────────────────────────────────────────
# Inherited: stagnation inlet, characteristic outlet, ramp p0 -> p_out over 1000
# steps; IC = fluid at rest at the reservoir state with alpha_floor 1e-3.
bc:
  p0:            12000000.0
  T_g0:          295.0
  T_l0:          295.0
  void_fraction: 1.0e-3
  p_out:         2000000.0
  # p_out_ramp_steps: 5000

# ── Run control ───────────────────────────────────────────────────────────────
run:
  n_steps: 20000
  ssr_tol: 1.0e-8

# ── Output ────────────────────────────────────────────────────────────────────
# repo_main is resolved from dev_scripts/ by main_two_fluid.py; this puts the
# results in ./results of this folder.
save_options:
  repo_main: ../case_study/data_assimilation/results
  repo_run: test_cold_start_manual

time_control:
  ser_beta:     1.0


ic:
  # type: nozzlex_csv
  # run: design_case4/hem_seed_s10_a3e-3.csv
  type: restart
  run: results/ladder_S3_N400_muscl_van_albada_20261016_112644   # relative to this folder (main.py runs from here)
  alpha_floor: 1.0e-8
