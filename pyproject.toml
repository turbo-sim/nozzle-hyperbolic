[tool.poetry]
name = "nozzle_hyperbolic"
version = "0.0.1"
description = "A Python tool for modeling flows in nozzles."
authors = ["Andrea Cioffi", "Alberto Bergamin", "Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/nozzle-hyperbolic"
documentation = "https://github.com/turbo-sim/nozzle-hyperbolic"
packages = [{ include = "nozzle_hyperbolic", from = "src" }]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
jax = "^0.6.0"
jaxprop = "^0.5.7"
#jaxprop = { path = "../../jaxprop/", develop = true }
equinox = "^0.12.0"
optimistix = "^0.0.10"
# PySolverView's controlled SLSQP bridge requires this SciPy interface.
scipy = "1.17.1"
# NURBSpy's JAX extra currently requires Quadax <0.3, which needs NumPy <2.5.
numpy = ">=2.4.6,<2.5"
matplotlib = "^3.11.2"
jaxlib = "^0.6.0"
diffrax = "^0.7.0"
pysolver-view = "^0.7.4"
#pysolver-view = { path = "../../pysolver_view/", develop = true }
tqdm = "^4.67.1"
nurbspy = { version = "^1.4.0", extras = ["jax"] }
#nurbspy = { path = "../../nurbspy/", develop = true, extras = ["jax"] }
snakeviz = "^2.2.2"
parse = "^1.22.0"
line-profiler = "^5.0.2"
tensorboard = "^2.20.0"


[tool.poetry.group.dev.dependencies]
ipython = ">=8.13,<8.17"
toml = "^0.10.2"
black = "^25.1.0"
pytest = "^8.3.5"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
bump-my-version = "^1.5.1"
sphinx-autobuild = "^2024.10.3"
myst-parser = "^4.0.1"
sympy = "^1.14.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"


# Version bumping and releasing (run from the repository root):
# 1. Install development tools: poetry install --with dev
# 2. Commit your changes first; bumping requires a clean working tree.
# 3. Preview a bump: poetry run bump-my-version bump --dry-run --verbose patch
# 4. Choose ONE increment (updates version files, commits, and creates a vX.Y.Z tag):
#    poetry run bump-my-version bump patch
#    poetry run bump-my-version bump minor
#    poetry run bump-my-version bump major
# 5. Push the reviewed release branch and tags:
#    git push origin <branch> --follow-tags
# 6. Build and publish the package (PyPI credentials must already be configured):
#    poetry build
#    poetry publish
# This repository does not yet have an automated publishing workflow.
