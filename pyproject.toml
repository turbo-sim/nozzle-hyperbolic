[tool.poetry]
name = "nozzle_hyperbolic"
version = "0.0.1"
description = "A Python tool for modeling flows in nozzles."
authors = ["Andrea Cioffi",  "Roberto Agromayor"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/turbo-sim/hyperbolic-nozzle"
documentation = "https://to.be.completed.com"

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
numpy = "^2.4.0"
scipy = "^1.17.1"
matplotlib = "^3.10.0"
pandas = "^2.2.0"
openpyxl = "^3.1.2"
PyYAML = "^6.0.1"
toml = "^0.10.2"
cycler = "^0.12.1"
parse = "^1.20.2"
pexpect = "^4.9.0"
jaxprop = "^0.5.0"

[tool.poetry.group.dev.dependencies]
ipython = "^8.24.0"
black = "^24.4.2"
pytest = "^8.2.1"
pyzotero = "^1.5.19"
numpydoc = "^1.7.0"
sphinx = "^7.3.7"
sphinx-tabs = "^3.4.5"
sphinx-book-theme = "^1.1.2"
sphinx-rtd-theme = "^2.0.0"
sphinxcontrib-bibtex = "^2.6.2"
sphinxawesome-theme = "^5.1.5"
sphinx-design = "^0.6.0"
sphinx-togglebutton = "^0.3.2"
bump2version = "^1.0.1"
myst-parser = "^3.0"
linkify-it-py = "^2.0"
sphinx-autobuild = "^2024.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"