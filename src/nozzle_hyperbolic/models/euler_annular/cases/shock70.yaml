# Physical verification case; numerical settings belong to the benchmark profile.
schema_version: 1
model: euler_annular
id: shock70
label: Radial normal shock at 70% with swirl
description: Historical fixed annular geometry and steady inviscid operating point. Meridional flow is
  positive; analytical invariants select boundary data and never seed the numerical solution.
fluid:
  backend: perfect_gas
  name: Air
geometry:
  kind: radial
  r_in: 0.1
  r_out: 0.2
  height: 0.005
inlet:
  p0: 200000.0
  T0: 300.0
  M_m: 1.5
  alpha_tangent: 0.3333333333333333
boundaries:
  inlet: supersonic
  outlet: subsonic
  outlet_formulation: acoustic
reference:
  shock_fraction: 0.7
walls:
  shear_stress: 0.0
  heat_flux: 0.0
accuracy:
  recommended_finest_cells: 400
  shock_position_cells: 2.0
